<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locadora SOD</title>
    <link rel="stylesheet" type="text/css" href="estilo.css">
    <script type="text/javascript" src="./scripts.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <main class="w-100">
        <button class="darkmode" type="button" onclick="ModoEscuro()">Modo escuro</button>
        <h1>Locadora SOD</h1>
        <br>
        <br>
        <nav>
        <a href="LOCADORA.html" class="link">Página do Funcionário</a>
        <a href="USUARIO.html" class="link">Página do Usuário</a>
        </nav>
        <h2 class="titulo-catalogo">Catálogo de Filmes</h2>
        <div class="linhas">
            <button class="adicionar-filme" onclick="AbrirJanela()"> + <br> Adicionar <br> Filme</button>
        </div>
        <div id="modal" class="janela-adicionar">
    <div class="conteudo-modal">

        <h2>Adicionar Filme</h2>
        <p>Cadastrar um novo filme</p>

        <form id="formFilme">

    <label>Nome do filme</label>
    <input type="text" id="nomeFilme" placeholder="Nome do filme" required>

    <label>Foto do filme</label>
<input type="file" id="fotoFilme" accept="image/*">

<div class="ajuste-imagem">
    <p>Prévia da capa</p>

    <div class="preview-capa">
        <img id="previewImagem" src="" alt="Prévia da capa">
    </div>

    <label>Zoom da imagem</label>
    <input type="range" id="zoomImagem" min="100" max="200" value="100">
</div>

    <label>Categoria</label>
    <select id="categoriaFilme" required>
        <option value="">Selecione</option>
        <option>Ação</option>
        <option>Aventura</option>
        <option>Comédia</option>
        <option>Drama</option>
        <option>Romance</option>
        <option>Terror</option>
        <option>Ficção científica</option>
    </select>

    <label>Classificação etária</label>
    <select id="classificacaoFilme" required>
        <option value="">Selecione</option>
        <option>Livre</option>
        <option>10 anos</option>
        <option>12 anos</option>
        <option>14 anos</option>
        <option>16 anos</option>
        <option>18 anos</option>
    </select>

    <label>Preço</label>
    <input type="number" id="precoFilme" placeholder="Ex: 15.00" step="0.01" min="0" required>

    <label>Ano de lançamento</label>
    <input type="number" id="anoFilme" placeholder="Ex: 2025" required>

    <label>Sinopse</label>
    <textarea id="sinopseFilme" placeholder="Digite a sinopse..." required></textarea>
    <button type="submit">Cadastrar filme</button>
    <button type="button" onclick="FecharJanela()">Cancelar</button>

</form>

    </div>
</div>
    </main>
    <footer>Locadora SOD <br> Proprietarios: Matheus Leal e Pedro Mateus</footer>
</body>
</html>
